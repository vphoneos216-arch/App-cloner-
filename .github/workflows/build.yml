name: build

# Builds the APK in CI, which is how this gets built from a phone: push, wait, then
# download the APK from the run's artifacts.
#
# Triggers on every branch on purpose, so the first push builds whatever branch it lands on
# without anyone editing this file first.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle is pinned by the action rather than by a committed wrapper jar, so the repo
      # carries no binary.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests (engine parsers and evaluators)
        run: gradle :engine:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Assemble release APK (unsigned)
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # Renamed so the file is identifiable once it is in a Downloads folder.
      - name: Name the APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/appcloner-gaming-debug-b${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/*.apk "dist/appcloner-gaming-release-unsigned-b${{ github.run_number }}.apk" || true
          ls -lh dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: appcloner-gaming-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK (unsigned)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: appcloner-gaming-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # A release asset is a direct .apk download; an artifact always arrives as a zip and
      # needs a signed-in session. This is the link to install from on a phone.
      - name: Publish the APKs to a release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "b${{ github.run_number }}" dist/*.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Debug APK installs as-is. The release APK is unsigned; sign it first. Commit ${{ github.sha }}. Built by CI, not yet run on a device." \
            --latest

      # Kept on failure too: this is what turns a red run into a fixable compiler error.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            engine/build/reports/
            app/build/reports/
            engine/build/test-results/
          if-no-files-found: ignore
