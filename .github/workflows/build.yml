name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships an Android SDK; make sure the exact packages this build
      # compiles against are present. Failures here are not fatal: the Android Gradle
      # plugin downloads missing packages itself when the licences are accepted.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            (yes || true) | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;34.0.0" > /dev/null || true
          else
            echo "sdkmanager not found at $SDKMANAGER; relying on the Gradle plugin"
          fi

      # The fixed signing key lives in the SIGNING_KEYSTORE_B64 repository secret, never in
      # the repository. Without it the APK is signed with a throw-away key (see README).
      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "::warning::No SIGNING_KEYSTORE_B64 secret. This APK gets a throw-away signature and will not install over other builds."
            exit 0
          fi
          mkdir -p signing
          # Pasting on a phone can add spaces or line breaks; strip them before decoding.
          if ! printf '%s' "$SIGNING_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > signing/release.p12; then
            echo "::error::SIGNING_KEYSTORE_B64 is not valid base64."
            exit 1
          fi
          # Fail here with a clear message instead of deep inside the Gradle signing task.
          if ! keytool -list -keystore signing/release.p12 -storetype PKCS12 -storepass "${SIGNING_PASSWORD:-gamecloner}" > /dev/null 2>&1; then
            echo "::error::SIGNING_KEYSTORE_B64 does not decode to a PKCS12 keystore that opens with the signing password."
            exit 1
          fi
          echo "Signing with the fixed key from the repository secret."

      - name: Build release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/GameCloner-${{ github.run_number }}.apk"
          sha256sum dist/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: GameCloner-apk
          path: dist/*.apk
          if-no-files-found: error

      # A release gives a direct .apk download link that works from a phone browser.
      - name: Publish release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/*.apk \
            --title "Game Cloner build ${{ github.run_number }}" \
            --notes "Automated build of commit ${{ github.sha }}." \
            --target "${{ github.sha }}"

      # Report only: prints Android Lint findings (API-level misuse and similar) to the log.
      - name: Lint report
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintRelease
